name: Credential evidence link integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-source-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only checkout; no persisted Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check path and metadata contracts; never open PDF contents
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
